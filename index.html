<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="MCK - Seminário Internacional" />
    <meta name="author" content="Ansonika" />
    <title>MCK - Seminário Internacional</title>

    <!-- Favicons-->
    <link rel="apple-touch-icon" type="image/x-icon" href="img/favicon.png" />
    <link rel="apple-touch-icon" type="image/x-icon" sizes="72x72" href="img/favicon.png" />
    <link rel="apple-touch-icon" type="image/x-icon" sizes="114x114" href="img/favicon.png" />
    <link rel="apple-touch-icon" type="image/x-icon" sizes="144x144" href="img/favicon.png" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

    <!-- GOOGLE WEB FONT -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css?family=Work+Sans:300,400,500,600,700&display=swap" rel="stylesheet" />

    <!-- BASE CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/vendors.css" rel="stylesheet" />

    <!-- YOUR CUSTOM CSS -->
    <link href="css/custom.css" rel="stylesheet" />

    <!-- TAILWINDCSS SCRIPT -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg_color_gray">
    <div id="preloader">
      <div data-loader="circle-side"></div>
    </div>
    <!-- /Preload -->

    <div id="loader_form">
      <div data-loader="circle-side-2"></div>
    </div>
    <!-- /loader_form -->

    <div class="min-vh-100 d-flex flex-column">
      <header>
        <div class="container-fluid">
          <div class="flex items-center justify-between">
            <div class="col-4">
              <div id="language-selector" class="flex items-center justify-start gap-2">
                <button onclick="setLanguage('de')" class="hover:text-red-700 hover:underline transition-all">DE</button>
                <div>|</div>
                <button onclick="setLanguage('EN')" class="hover:text-red-700 hover:underline transition-all">EN</button>
                <div>|</div>
                <button onclick="setLanguage('nl')" class="hover:text-red-700 hover:underline transition-all">NL</button>
                <div>|</div>
                <button onclick="setLanguage('pt')" class="hover:text-red-700 hover:underline transition-all">PT</button>
              </div>
            </div>
            <div class="col-4 text-center hidden md:block">
              <h1
                data-translate="maranatha"
                data-nl="Maranatha Christen Kerk"
                data-en="Maranatha Chirstian Church"
                data-pt="Igreja Cristã Maranata"
                data-de="Maranatha Christen Kerk"
                class="text-sm md:text-lg font-bold uppercase text-red-700"
              >
                Maranatha Christen Kerk
              </h1>
              <!-- <a href="index.html"><img src="img/logo.svg" alt="" class="img-fluid" width="95" height="30" /></a> -->
            </div>
            <div class="col-4">
              <div id="social">
                <ul>
                  <!-- <li>
                    <a href="#0"><i class="bi bi-facebook"></i></a>
                  </li>
                  <li>
                    <a href="#0"><i class="bi bi-twitter-x"></i></a>
                  </li> -->
                  <li>
                    <a href="https://www.instagram.com/maranatha.nl/"><i class="bi bi-instagram"></i></a>
                  </li>
                </ul>
              </div>
              <!-- /social -->
            </div>
          </div>
        </div>
        <!-- /container -->
      </header>
      <!-- /header -->

      <div class="container-fluid d-flex flex-column my-auto">
        <div id="wizard_container">
          <div id="top-wizard">
            <div id="progressbar"></div>
          </div>
          <!-- /top-wizard -->
          <form name="example-1" id="wrapped" method="POST">
            <input id="website" name="website" type="text" value="" />
            <!-- Leave input above for security protection, read docs for details -->

            <div id="middle-wizard">
              <div class="space-y-4 mb-10">
                <img src="img/banner.svg" alt="" class="img-fluid" width="100%" height="30" />
                <h3
                  class="text-2xl md:text-3xl text-center font-bold"
                  data-translate="title"
                  data-nl="Inschrijvingsperiode gesloten!"
                  data-en="Subscription period closed!"
                  data-pt="Período de inscrições encerrado!"
                  data-de="Anmeldezeitraum geschlossen!"
                >
                  Período de inscrições encerrado!
                </h3>
              </div>
              <!-- /Step -->
            </div>
            <!-- /bottom-wizard -->
          </form>
        </div>
        <!-- /Wizard container -->
      </div>
      <!-- /Container -->
    </div>

    <!-- COMMON SCRIPTS -->
    <script src="js/common_scripts.min.js"></script>
    <script src="js/common_functions.js"></script>
    <script src="assets/validate.js"></script>

    <!-- SPECIFIC SCRIPTS -->
    <script src="js/registration_wizard_func.js"></script>
    <script src="js/autocomplete_func.js"></script>
    <!-- <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initMap"></script> -->

    <script>
      function setLanguage(lang) {
        const elements = document.querySelectorAll('[data-translate]');
        elements.forEach((element) => {
          element.textContent = element.getAttribute(`data-${lang}`);
        });
      }

      // Set default language on page load
      document.addEventListener('DOMContentLoaded', () => {
        setLanguage('pt'); // Default to Portuguese
      });
    </script>
  </body>
</html>
